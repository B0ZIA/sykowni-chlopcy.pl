# Codzienne pobieranie opinii z wizytówki Google do pliku reviews.json.
# Odświeżamy raz na dobę, bo warunki Google Maps Platform nie pozwalają
# przechowywać treści opinii dłużej niż 30 dni.
#
# Konfiguracja (Settings → Secrets and variables → Actions):
#   secret   GOOGLE_MAPS_API_KEY – klucz z Google Cloud (Places API New), wymagany
#   variable GOOGLE_PLACE_ID     – opcjonalnie, gdy zmieni się wizytówka
#
# Dopóki sekret nie jest ustawiony, workflow kończy się bez zmian,
# a strona pokazuje opinie wpisane ręcznie w index.html.
name: Odswiez opinie Google

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "reviews"
  cancel-in-progress: false

jobs:
  reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz opinie
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # wizytówka Sykowni Chłopcy; zmienna z ustawień repo ma pierwszeństwo
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID || 'ChIJqxYxlZgfcAoRKnF5NTg_UP4' }}
        run: python tools/fetch_reviews.py --out reviews.json

      - name: Zapisz zmiany
        run: |
          if [ -n "$(git status --porcelain reviews.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reviews.json
            git commit -m "Aktualizacja opinii Google"
            git push
          else
            echo "Bez zmian w opiniach."
          fi
